name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive unsigned
        run: |
          xcodebuild -project PositionAI.xcodeproj -scheme PositionAI -configuration Release -destination generic/platform=iOS -archivePath build/PositionAI.xcarchive archive CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/PositionAI.xcarchive/Products/Applications/PositionAI.app Payload/
          zip -r PositionAI.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PositionAI-ipa
          path: PositionAI.ipa
